<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>회원 정보 수정/삭제 - CNU AIR</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary-bg: #fff;
      --secondary-bg: #fafafa;
      --text-default: #333;
      --text-accent: #222;
      --border-color: #ddd;
      --link-color: #0077cc;
      --link-hover: #005fa3;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Noto Sans KR', sans-serif;
      background: var(--secondary-bg);
      color: var(--text-default);
    }
    .header {
      background: var(--primary-bg);
      padding: 16px 40px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      max-width: 1200px;
      margin: 0 auto;
    }
    .header h1 {
      font-size: 32px;
      flex: 1;
      color: var(--text-accent);
    }
    .nav-buttons {
      display: flex;
      gap: 8px;
    }
    .nav-buttons input[type="text"] {
      padding: 8px;
      border: 1px solid var(--border-color);
      border-radius: 4px;
      width: 200px;
      outline: none;
    }
    .nav-buttons button {
      padding: 8px 16px;
      border: 1px solid var(--border-color);
      background: var(--primary-bg);
      border-radius: 4px;
      cursor: pointer;
    }
    .container {
      display: flex;
      max-width: 1200px;
      margin: 24px auto;
      background: var(--primary-bg);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }
    .sidebar {
      width: 200px;
      background: var(--secondary-bg);
      border-right: 1px solid var(--border-color);
      padding: 24px 16px;
    }
    .sidebar h3 {
      font-size: 16px;
      margin-bottom: 12px;
      color: var(--text-accent);
    }
    .sidebar ul {
      list-style: none;
      font-size: 14px;
    }
    .sidebar ul li {
      margin-bottom: 8px;
    }
    .sidebar ul li.active a {
      font-weight: 500;
      color: var(--text-accent);
    }
    .sidebar ul li a {
      text-decoration: none;
      color: var(--text-default);
      transition: color 0.2s;
    }
    .sidebar ul li a:hover {
      color: var(--link-color);
    }
    .main {
      flex: 1;
      padding: 32px;
    }
    .main h2 {
      font-size: 20px;
      margin-bottom: 24px;
      color: var(--text-accent);
    }
    .main ul {
      list-style: none;
      font-size: 16px;
    }
    .main ul li {
      margin-bottom: 16px;
    }
    .main ul li a {
      text-decoration: none;
      color: var(--link-color);
      transition: color 0.2s;
    }
    .main ul li a:hover {
      color: var(--link-hover);
    }
  </style>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/plus_ultra.css') }}">
</head>
<body>
  <header class="header">
    <!-- 로고: 클릭 시 메인 페이지(로그인 완료 홈)로 이동 -->
    <h1><a href="{{ url_for('auth.login_complete_homepage') }}">PLUS-ULTRA AIR</a></h1>
    <div class="nav-buttons">
      <!-- 검색 입력 필드 -->
      <input type="text" placeholder="Search...">
      <!-- 검색 버튼 (현재 기능 미구현) -->
      <button>Search</button>
      <!-- 항공편 조회 페이지로 이동 -->
      <button>항공편</button>
      <!-- 개인 페이지 진입 -->
      <button class="nav-btn" onclick="location.href='/my_page'">My page</button>
      <!-- 로그아웃 처리 -->
      <button class="nav-btn" onclick="location.href='{{ url_for('auth.logout') }}'">Log Out</button>
    </div>
  </header>

  <div class="container">
    <aside class="sidebar">
      <h3>My page</h3>
      <ul>
        <!-- 현재 활성화된 메뉴 표시 -->
        <li class="active"><a href="#">회원 정보 수정/삭제</a></li>
        <!-- 이력 조회 페이지 링크 -->
        <li><a href="#" onclick="location.href='/my_page_2'">이력 조회</a></li>
      </ul>
    </aside>
    <main class="main">
      <h2>회원 정보 수정 / 삭제</h2>
      <ul>
        <!-- 주요 기능 안내 -->
        <li><strong>회원 정보 수정</strong></li>
        <!-- 비밀번호 변경 페이지 링크 -->
        <li><a href="#">비밀번호 변경하기</a></li>
        <!-- 전화번호 수정 페이지 링크 -->
        <li><a href="#">전화번호 수정하러 가기</a></li>
        <!-- 주소 수정 페이지 링크 -->
        <li><a href="#">주소 수정하러 가기</a></li>
        <!-- 회원 탈퇴 페이지 링크 (강조 스타일 적용) -->
        <li><a href="#" style="color: var(--link-color); font-weight:500;">회원 탈퇴</a></li>
      </ul>
    </main>
  </div>
</body>
</html>
